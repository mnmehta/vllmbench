hydra:
  job:
    chdir: false

# Group: run (benchmark settings)
run:
  # Core parameters
  framework: vllm
  model: Qwen/Qwen3-0.6B
  input_len: 1000
  output_len: 1000
  queries_per_user: 20
  concurrencies: [1, 2, 4, 8, 16, 32, 64, 128, 256]
  benchmark_pod: "llmdbench-inference-perf-launcher"

  # Target selection
  target_type: gateway  # options: gateway, direct; env TARGET_TYPE overrides
  target:               # optional explicit URL; env TARGET overrides

  # MLflow experiment name; can interpolate params
  experiment_name: "llm-d-version_oct1_${run.input_len}_osl${run.output_len}"

# Group: install (installer settings)
install:
  # Git and paths
  repo_url: "https://github.com/llm-d/llm-d"
  llmd_dir: "/tmp/llm-d"
  well_lit_path: "guides/inference-scheduling/"

  # Helmfile overrides file (interpreted relative to install_llmd.py location)
  helmfile_overrides:
  namespace: "llm-d-inference-scheduler"

  # Helmfile behavior
  helmfile_path: "helmfile.yaml.gotmpl"
  destroy_first: true
  # GAIE overrides (0+ values files)
  gaie_helmfile_overrides: []
  # ModelService (ms) scalars
  decode_replicas: 8
  # Tensor parallelism for decode pod (sets decode.parallelism.tensor in Helm)
  decode_tp: 1
  # Disable vLLM prefix caching (adds --no-enable-prefix-cache)
  disable_prefix_cache: false
  # Extra vLLM command-line options (list or space-separated string)
  # Example: ["--max-model-len", "32000"] or "--max-model-len 32000"
  extra_vllm_options: []

# Group: multiturn (multi-turn benchmark settings)
multiturn:
  run_name: "multiturn"
  pod_name: "vllm" #This is where vllm bench is run from
  namespace: ${install.namespace}
  workdir: "/model-cache/vllm_build/vllm/benchmarks/multi_turn"
  url: "http://infra-inference-scheduling-inference-gateway-istio"
  generated_input_path: "/tmp/multiturn_input.json"
  seed: 999999
  input:
    filetype: "generate_conversations"
    num_conversations: 512
    text_files: ["combined_gutenberg_books.txt"]
    print_stats: false
    prompt_input:
      num_turns:
        distribution: "uniform"
        min: 10
        max: 10
      common_prefix_num_tokens:
        distribution: "constant"
        value: 0
      prefix_num_tokens:
        distribution: "lognormal"
        average: 10000
        max: 10000
      num_tokens:
        distribution: "uniform"
        min: 128
        max: 128
    prompt_output:
      num_tokens:
        distribution: "uniform"
        min: 128
        max: 128
  num_clients: 32
  max_active_conversations: 512
  request_rate: 0.0
  experiment_name: "multiturn_${run.model}"

# Group: guidellm_multiturn (GuideLLM multi-turn benchmark settings)
guidellm_multiturn:
  run_name: "guidellm_multiturn"
  pod_name: "vllm"
  namespace: ${install.namespace}
  workdir: "/model-cache/vllm_build/vllm/benchmarks/multi_turn"  # not used directly but kept for consistency
  target: "http://infra-inference-scheduling-inference-gateway-istio"
  # Default profile/options as requested; can be overridden via Hydra
  profile: "concurrent"
  rate: 1
  data:
    prompt_tokens: 128
    output_tokens: 128
    prefix_tokens: 10000
    prefix_count: 16
    turns: 5
  max_requests: 5
  experiment_name: "guidellm_${run.model}"
