apiVersion: v1
kind: Namespace
metadata:
  name: torchrun-nvlink-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: torchrun-service-account
  namespace: torchrun-nvlink-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: torchrun-anyuid-scc-binding
subjects:
- kind: ServiceAccount
  name: torchrun-service-account
  namespace: torchrun-nvlink-test
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: torchrun-headless
  namespace: torchrun-nvlink-test
spec:
  clusterIP: None
  selector:
    app: torchrun-nvlink-test
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: torchrun-nvlink-test
  namespace: torchrun-nvlink-test
spec:
  serviceName: torchrun-headless
  replicas: 3
  selector:
    matchLabels:
      app: torchrun-nvlink-test
  template:
    metadata:
      labels:
        app: torchrun-nvlink-test
    spec:
      serviceAccountName: torchrun-service-account
      restartPolicy: Always
      containers:
      - name: torchrun-container
        image: nvcr.io/nvidia/pytorch:25.11-py3
        resources:
          limits:
            nvidia.com/gpu: 4
        command:
        - /bin/bash
        - -c
        - |
          export MASTER_ADDR="torchrun-nvlink-test-0.torchrun-headless.torchrun-nvlink-test.svc.cluster.local"
          export MASTER_PORT=12345
          export NNODES=3
          export NPROC_PER_NODE=4

          ORDINAL=$(echo ${HOSTNAME##*-})
          export NODE_RANK=$ORDINAL

          echo "Master: $MASTER_ADDR, Node Rank: $NODE_RANK, World Size: $((NNODES*NPROC_PER_NODE))"

          mkdir -p /workspace
          cat << 'PYTHONEOF' > /workspace/nvlink_test.py
          import torch
          import torch.distributed as dist
          import os
          
          dist.init_process_group(backend='nccl')
          rank = dist.get_rank()
          world_size = dist.get_world_size()
          local_gpu = rank % torch.cuda.device_count()
          print(f"[Rank {rank}/{world_size}] Using GPU {local_gpu}: {torch.cuda.get_device_name(local_gpu)}")
          
          if rank == 0:
              for i in range(torch.cuda.device_count()):
                  for j in range(i + 1, torch.cuda.device_count()):
                      a = torch.randn(1024 * 1024, device=i)
                      b = torch.empty_like(a, device=j)
                      torch.cuda.synchronize()
                      torch.cuda.current_stream(i).record_event(torch.cuda.Event(enable_timing=True))
                      b.copy_(a)
                      torch.cuda.synchronize()
                      print(f"Bandwidth GPU {i} -> GPU {j}: {a.numel()*4/(1024**2)} MB")
          dist.destroy_process_group()
          PYTHONEOF

          torchrun --nnodes=$NNODES --nproc_per_node=$NPROC_PER_NODE \
                   --node_rank=$NODE_RANK --rdzv_backend=c10d \
                   --rdzv_endpoint=$MASTER_ADDR:$MASTER_PORT \
                   /workspace/nvlink_test.py

