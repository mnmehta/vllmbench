apiVersion: v1
kind: Namespace
metadata:
  name: torchrun-nvlink-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: torchrun-service-account
  namespace: torchrun-nvlink-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: torchrun-anyuid-scc-binding
subjects:
- kind: ServiceAccount
  name: torchrun-service-account
  namespace: torchrun-nvlink-test
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: torchrun-headless
  namespace: torchrun-nvlink-test
spec:
  clusterIP: None
  selector:
    app: torchrun-nvlink-test
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: torchrun-nvlink-test
  namespace: torchrun-nvlink-test
spec:
  serviceName: torchrun-headless
  replicas: 3
  selector:
    matchLabels:
      app: torchrun-nvlink-test
  template:
    metadata:
      labels:
        app: torchrun-nvlink-test
    spec:
      serviceAccountName: torchrun-service-account
      restartPolicy: Always
      containers:
      - name: torchrun-container
        image: nvcr.io/nvidia/pytorch:25.11-py3
        resources:
          limits:
            nvidia.com/gpu: 4
        command:
        - /bin/bash
        - -c
        - |
          export MASTER_ADDR="torchrun-nvlink-test-0.torchrun-headless.torchrun-nvlink-test.svc.cluster.local"
          export MASTER_PORT=12345
          export NNODES=3
          export NPROC_PER_NODE=4

          ORDINAL=$(echo ${HOSTNAME##*-})
          export NODE_RANK=$ORDINAL

          echo "Master: $MASTER_ADDR, Node Rank: $NODE_RANK, World Size: $((NNODES*NPROC_PER_NODE))"

          mkdir -p /workspace
          cat << 'PYTHONEOF' > /workspace/nvlink_test.py
          import os
          import time
          import torch
          import torch.distributed as dist
          
          def bytes_to_mib(b): 
              return b / (1024 * 1024)
          
          def main():
              dist.init_process_group(backend='nccl')
              rank = dist.get_rank()
              world_size = dist.get_world_size()
          
              # Map rank to a local GPU
              local_rank = int(os.environ.get("LOCAL_RANK", rank % torch.cuda.device_count()))
              torch.cuda.set_device(local_rank)
          
              # Payload: 256 MiB float32 tensor
              elem_size = 4
              size_mib = 256
              numel = (size_mib * 1024 * 1024) // elem_size
              warmup, iters = 3, 8
          
              send_buf = torch.randn(numel, device='cuda')
              recv_buf = torch.empty_like(send_buf)
          
              # Rank 0 collects a world_size x world_size MiB/s matrix
              bw = [[0.0 for _ in range(world_size)] for _ in range(world_size)] if rank == 0 else None
          
              for src in range(world_size):
                  for dst in range(world_size):
                      # Skip diagonal; no send/recv to self
                      if src == dst:
                          dist.barrier()
                          vals = [None for _ in range(world_size)]
                          dist.all_gather_object(vals, (src, dst, 0.0))
                          if rank == 0:
                              bw[src][dst] = 0.0
                          continue
          
                      # Synchronize all ranks for the (src, dst) measurement
                      dist.barrier()
          
                      if rank == src:
                          # Warmup
                          for _ in range(warmup):
                              dist.send(send_buf, dst=dst)
                          torch.cuda.synchronize()
          
                          t0 = time.perf_counter()
                          for _ in range(iters):
                              dist.send(send_buf, dst=dst)
                          torch.cuda.synchronize()
                          t1 = time.perf_counter()
          
                          total_bytes = send_buf.element_size() * send_buf.numel() * iters
                          secs = max(t1 - t0, 1e-9)
                          mibps = bytes_to_mib(total_bytes) / secs
                      elif rank == dst:
                          for _ in range(warmup):
                              dist.recv(recv_buf, src=src)
                          for _ in range(iters):
                              dist.recv(recv_buf, src=src)
                          mibps = 0.0
                      else:
                          mibps = 0.0
          
                      # Gather the sender's measured bandwidth to rank 0
                      vals = [None for _ in range(world_size)]
                      dist.all_gather_object(vals, (src, dst, mibps))
                      if rank == 0:
                          for s, d, v in vals:
                              if s == src and d == dst and v > 0:
                                  bw[s][d] = v
                                  break
          
              if rank == 0:
                  print("MiB/s bandwidth matrix (src rows -> dst cols):")
                  for s in range(world_size):
                      row = " ".join(f"{bw[s][d]:8.0f}" for d in range(world_size))
                      print(row)
          
              dist.destroy_process_group()
          
          if __name__ == "__main__":
              main()
          PYTHONEOF

          torchrun --nnodes=$NNODES --nproc_per_node=$NPROC_PER_NODE \
                   --node_rank=$NODE_RANK --rdzv_backend=c10d \
                   --rdzv_endpoint=$MASTER_ADDR:$MASTER_PORT \
                   /workspace/nvlink_test.py

