apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-pushgateway
  namespace: ${NAMESPACE}
  labels:
    app: prometheus-pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-pushgateway
  template:
    metadata:
      labels:
        app: prometheus-pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: pushgateway
        image: prom/pushgateway:v1.9.0
        imagePullPolicy: IfNotPresent
        args:
        - --web.listen-address=0.0.0.0:9091
        ports:
        - name: http
          containerPort: 9091
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9091
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9091
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-pushgateway
  namespace: ${NAMESPACE}
  labels:
    app: prometheus-pushgateway
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9091
    targetPort: 9091
  selector:
    app: prometheus-pushgateway
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-pushgateway
  namespace: ${NAMESPACE}
  labels:
    app: prometheus-pushgateway
spec:
  selector:
    matchLabels:
      app: prometheus-pushgateway
  endpoints:
  - port: http
    interval: 15s
    path: /metrics
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: prometheus-pushgateway
  namespace: ${NAMESPACE}
  labels:
    app: prometheus-pushgateway
spec:
  to:
    kind: Service
    name: prometheus-pushgateway
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect


